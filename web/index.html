<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tower</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230E1420'/%3E%3Cpath d='M8 3 L11 11 H5 Z' fill='%23F5C544'/%3E%3Crect x='7.25' y='11' width='1.5' height='2' fill='%238292AB'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0E1420;
    --surface: #151D2C;
    --surface-deep: #0A0F17;
    --border: #232E42;
    --border-soft: #1B2536;
    --text: #D6DEEC;
    --text-dim: #8292AB;
    --text-faint: #5B6980;
    --running: #3FCF8E;
    --waiting: #F5C544;
    --error: #F0716A;
    --idle: #7C8DA8;
    --gone: #66748C;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.45;
    min-height: 100vh;
    padding: 0 22px 40px;
  }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 18px 2px 14px;
    border-bottom: 1px solid var(--border-soft);
    margin-bottom: 20px;
  }
  .wordmark {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--text);
  }
  .wordmark .beacon { color: var(--waiting); }
  .counts {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-dim);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .counts .zero { color: var(--text-faint); }
  .counts b { font-weight: 600; color: var(--text); }
  .counts .need b { color: var(--waiting); }
  header .right {
    margin-left: auto;
    display: flex;
    align-items: baseline;
    gap: 12px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-dim);
  }
  #search {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 9px;
    width: 210px;
    outline: none;
  }
  #search::placeholder { color: var(--text-faint); }
  #search:focus { border-color: #2E3C57; }
  .conn { display: inline-flex; align-items: center; gap: 6px; }
  .conn-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--running);
    align-self: center;
  }
  .conn.down .conn-dot { background: var(--error); }
  #clock { color: var(--text-faint); font-variant-numeric: tabular-nums; }

  /* ---------- bands ---------- */
  .band-label {
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-faint);
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 22px 0 10px;
  }
  .band-label.attention { color: var(--waiting); }
  .band-label::after { content: ""; flex: 1; height: 1px; background: var(--border-soft); }
  .band-label.attention::after { background: color-mix(in srgb, var(--waiting) 26%, var(--bg)); }
  .band-label .n { font-family: var(--mono); letter-spacing: 0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
    gap: 12px;
  }

  /* ---------- cards ---------- */
  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px 12px 18px;
    cursor: pointer;
    overflow: hidden;
  }
  .card:hover { border-color: #2E3C57; }
  .card:focus-visible { outline: 2px solid var(--idle); outline-offset: 2px; }
  .card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--gone);
  }
  .card[data-status="running"]::before, .card[data-status="active"]::before { background: var(--running); }
  .card[data-status="waiting"]::before { background: var(--waiting); }
  .card[data-status="exited-error"]::before { background: var(--error); }
  .card[data-status="idle"]::before { background: var(--idle); }
  .card[data-status="idle"], .card[data-status="stale"], .card[data-status="closed"],
  .card[data-status="exited-ok"], .card[data-status="exited-unknown"] { opacity: 0.78; }
  .card:hover, .card.expanded { opacity: 1; }
  .card.expanded { grid-column: 1 / -1; cursor: default; }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gone); flex: none; }
  [data-status="running"] .dot, [data-status="active"] .dot { background: var(--running); }
  [data-status="waiting"] .dot { background: var(--waiting); }
  [data-status="exited-error"] .dot { background: var(--error); }
  [data-status="idle"] .dot { background: var(--idle); }
  [data-status="waiting"] .status, [data-status="waiting"] .ago-num { color: var(--waiting); }
  [data-status="exited-error"] .status, [data-status="exited-error"] .ago-num { color: var(--error); }
  @keyframes pulse { 50% { opacity: 0.25; } }
  [data-status="waiting"] .dot { animation: pulse 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { [data-status="waiting"] .dot { animation: none; } }

  /* the flight-board datum: how long since this session spoke */
  .ago { text-align: right; flex: none; }
  .ago-num {
    display: block;
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1.1;
  }
  .ago-sub { font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); }

  /* the name is the card's visual anchor; the command demotes to the meta line */
  .name {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 600;
    line-height: 1.25;
    display: flex;
    align-items: baseline;
    min-width: 0;
    flex: 1;
  }
  .name-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badge {
    flex: none;
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--idle);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    margin-left: 8px;
    transform: translateY(-2px);
  }
  .mail-badge {
    flex: none;
    font-family: var(--mono);
    font-size: 9.5px;
    font-weight: 600;
    color: var(--bg);
    background: var(--waiting);
    border-radius: 8px;
    padding: 1px 6px;
    margin-left: 8px;
    transform: translateY(-2px);
  }
  .status-row { margin-top: 3px; }

  /* read-only inbox view inside an expanded card */
  .mailbox {
    display: none;
    margin-top: 10px;
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .card.expanded .mailbox.has-mail { display: block; }
  .mail-title {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 4px;
  }
  .mail-row {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin: 3px 0;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .mail-row .from { color: var(--running); }
  .mail-row .when { color: var(--text-faint); }
  .meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta .sep { color: var(--text-faint); margin: 0 5px; }

  /* ---------- narrative strip ----------
     The story sits above the mechanical truth and reads as an annotation:
     sans type against the board's mono, its own quiet inset block. */
  .story {
    display: none;
    margin-top: 9px;
    padding: 7px 10px 6px 11px;
    background: var(--surface-deep);
    border-left: 2px solid var(--border);
    border-radius: 0 6px 6px 0;
    font-family: var(--sans);
    font-size: 12px;
    line-height: 1.4;
    color: var(--text-dim);
  }
  .card.has-story .story { display: block; }
  .story-line { display: flex; gap: 9px; margin: 2px 0; }
  /* author display:flex would otherwise defeat the UA [hidden] rule */
  .story-line[hidden] { display: none; }
  .story-line .k {
    flex: none;
    width: 28px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
    padding-top: 2px;
  }
  .story-line .v { min-width: 0; }
  .story-line.doing .v { color: var(--text); font-weight: 500; }
  .story-age {
    display: block;
    text-align: right;
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--text-faint);
    margin-top: 3px;
  }
  .history-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--text-faint);
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 0;
    margin-left: 10px;
  }
  .card.expanded .history-toggle.avail { display: inline; }
  .history-toggle:hover { color: var(--text); }
  .history {
    display: none;
    margin-top: 6px;
    border-top: 1px dashed var(--border-soft);
    padding-top: 6px;
  }
  .card.expanded.show-history .history { display: block; }
  .hist-item { font-size: 11.5px; color: var(--text-dim); margin: 4px 0; }
  .hist-item .t {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--text-faint);
    margin-right: 7px;
  }
  .hist-item .d { color: var(--text); }
  .hist-item .rest { color: var(--text-faint); }

  /* ---------- notice bar (no-key hint / key trouble) ---------- */
  .notice {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    padding: 7px 12px;
    margin-top: 16px;
  }
  .notice code { color: var(--text); }
  .notice.error { color: var(--waiting); border-color: color-mix(in srgb, var(--waiting) 30%, var(--bg)); }
  .notice .dismiss {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text-faint);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    padding: 0 2px;
  }
  .notice .dismiss:hover { color: var(--text); }

  .tail {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tail::before { content: "\2514 "; color: var(--text-faint); }
  .tail:empty { display: none; }

  /* ---------- search hits ---------- */
  .hits {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border-soft);
  }
  .card.searching .hits { display: block; }
  .card.searching .tail { display: none; }
  .hit {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  mark {
    background: color-mix(in srgb, var(--waiting) 32%, transparent);
    color: var(--text);
    border-radius: 2px;
    padding: 0 1px;
  }

  .output {
    display: none;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--text-dim);
    background: var(--surface-deep);
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    margin-top: 10px;
    padding: 10px 12px;
    max-height: 340px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    cursor: text;
  }
  .card.expanded .output { display: block; }

  /* ---------- empty state ---------- */
  .empty {
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 48px 24px;
    text-align: center;
    color: var(--text-dim);
    margin-top: 24px;
  }
  .empty p { margin-bottom: 14px; }
  .empty code {
    font-family: var(--mono);
    font-size: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    color: var(--text);
  }
</style>
</head>
<body>
<header>
  <div class="wordmark"><span class="beacon">&#9650;</span> tower</div>
  <div class="counts" id="counts"></div>
  <div class="right">
    <input id="search" type="search" placeholder="search sessions  /" spellcheck="false" autocomplete="off">
    <span class="conn" id="conn"><span class="conn-dot"></span><span id="conn-label">live</span></span>
    <span id="clock"></span>
  </div>
</header>

<div id="notice-slot"></div>
<main id="board"></main>

<script>
'use strict';

const state = {
  sessions: [],          // light session records from the daemon
  summaries: {},         // { on, keyless, error } from the daemon
  outputs: new Map(),    // id -> [lines]
  expandedId: null,
  expandedStamp: 0,      // lastOutputAt when the expanded card was last fetched
  pinned: true,          // expanded output scrolled to bottom?
  searchQ: '',           // active search text ('' = not searching)
  searchResults: null,   // Map id -> match record from /api/search
};

const ATTENTION = new Set(['waiting', 'exited-error']);
const RANK = { waiting: 0, 'exited-error': 1, running: 2, active: 2, idle: 3, stale: 4, 'exited-unknown': 5, 'exited-ok': 6, closed: 7 };
const LABELS = {
  running: 'running', active: 'active', idle: 'idle', waiting: 'waiting on you', stale: 'disconnected',
  'exited-ok': 'exited · ok', 'exited-error': 'exited', 'exited-unknown': 'exited', closed: 'closed',
};

function statusLabel(s) {
  if (s.status === 'exited-error') {
    // signal deaths report code 0/null from the PTY; the signal is the story
    return s.exitSignal ? `exited · ${s.exitSignal}` : `exited · code ${s.exitCode}`;
  }
  return LABELS[s.status] || s.status;
}

function fmtAgo(ms) {
  if (ms == null || !isFinite(ms) || ms < 0) return '–';
  const sec = Math.floor(ms / 1000);
  if (sec < 1) return 'now';
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec / 60);
  if (m < 60) return m + 'm ' + String(sec % 60).padStart(2, '0') + 's';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ' + String(m % 60).padStart(2, '0') + 'm';
  return Math.floor(h / 24) + 'd';
}

// coarse version for the staleness stamp: "as of 2m ago", not "2m 05s"
function fmtAgoCoarse(ms) {
  if (ms == null || !isFinite(ms) || ms < 0) return '';
  const sec = Math.floor(ms / 1000);
  if (sec < 60) return 'just now';
  const m = Math.floor(sec / 60);
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

function agoBasis(s) {
  return s.exited ? (s.exitedAt || s.lastOutputAt) : (s.lastOutputAt || s.startedAt);
}

function shortenCwd(cwd) {
  return (cwd || '').replace(/\\/g, '/').replace(/^\/(?:home|Users)\/[^/]+/, '~').replace(/^[A-Za-z]:\/Users\/[^/]+/, '~');
}

function sorted(list) {
  return list.slice().sort((a, b) => {
    const d = (RANK[a.status] ?? 9) - (RANK[b.status] ?? 9);
    if (d !== 0) return d;
    return (agoBasis(b) || 0) - (agoBasis(a) || 0);
  });
}

// ---------- card DOM (keyed, updated in place) ----------

const cards = new Map(); // id -> { el, refs }

function makeCard(s) {
  const el = document.createElement('article');
  el.className = 'card';
  el.tabIndex = 0;
  el.dataset.id = s.id;

  // head: the name is the anchor, the ago-clock keeps its corner
  const head = document.createElement('div');
  head.className = 'card-head';
  const name = document.createElement('h2');
  name.className = 'name';
  const nameText = document.createElement('span');
  nameText.className = 'name-text';
  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = 'agent';
  badge.hidden = true;
  const mailBadge = document.createElement('span');
  mailBadge.className = 'mail-badge';
  mailBadge.hidden = true;
  name.append(nameText, badge, mailBadge);
  const ago = document.createElement('span');
  ago.className = 'ago';
  const agoNum = document.createElement('span');
  agoNum.className = 'ago-num';
  const agoSub = document.createElement('span');
  agoSub.className = 'ago-sub';
  ago.append(agoNum, agoSub);
  head.append(name, ago);

  const statusRow = document.createElement('div');
  statusRow.className = 'status-row';
  const status = document.createElement('span');
  status.className = 'status';
  const dot = document.createElement('span');
  dot.className = 'dot';
  const statusLabelEl = document.createElement('span');
  status.append(dot, statusLabelEl);
  statusRow.append(status);

  const meta = document.createElement('p');
  meta.className = 'meta';
  const cwd = document.createElement('span');
  cwd.className = 'cwd';
  const sep = document.createElement('span');
  sep.className = 'sep';
  sep.textContent = '·';
  const cmd = document.createElement('span');
  cmd.className = 'cmd';
  const branchSep = document.createElement('span');
  branchSep.className = 'sep';
  branchSep.textContent = '·';
  const branch = document.createElement('span');
  branch.className = 'branch';
  meta.append(cwd, sep, cmd, branchSep, branch);

  // narrative strip: doing / last / next, clearly a layer above the mechanics
  const story = document.createElement('div');
  story.className = 'story';
  const storyRow = (cls, label) => {
    const row = document.createElement('p');
    row.className = 'story-line ' + cls;
    const k = document.createElement('span');
    k.className = 'k';
    k.textContent = label;
    const v = document.createElement('span');
    v.className = 'v';
    row.append(k, v);
    story.append(row);
    return v;
  };
  const doing = storyRow('doing', 'now');
  const last = storyRow('last', 'last');
  const next = storyRow('next', 'next');
  const storyAge = document.createElement('span');
  storyAge.className = 'story-age';
  const storyAgeText = document.createElement('span');
  const historyToggle = document.createElement('button');
  historyToggle.className = 'history-toggle';
  historyToggle.textContent = 'history';
  historyToggle.addEventListener('click', (e) => {
    e.stopPropagation(); // do not collapse the card
    el.classList.toggle('show-history');
  });
  storyAge.append(storyAgeText, historyToggle);
  const history = document.createElement('div');
  history.className = 'history';
  story.append(storyAge, history);

  const tail = document.createElement('p');
  tail.className = 'tail';
  const hits = document.createElement('div');
  hits.className = 'hits';
  const mailbox = document.createElement('div');
  mailbox.className = 'mailbox';
  const output = document.createElement('pre');
  output.className = 'output';

  el.append(head, statusRow, meta, story, tail, hits, mailbox, output);

  el.addEventListener('click', (e) => {
    if (output.contains(e.target)) return; // let people select text
    toggleExpand(s.id);
  });
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleExpand(s.id); }
  });
  output.addEventListener('scroll', () => {
    if (state.expandedId === el.dataset.id) {
      state.pinned = output.scrollTop + output.clientHeight >= output.scrollHeight - 6;
    }
  });

  return { el, refs: { statusLabelEl, agoNum, agoSub, nameText, badge, mailBadge, cwd, cmd, branchSep, branch, doing, last, next, storyAgeText, historyToggle, history, tail, hits, mailbox, output } };
}

// Prior chapters, newest first; read-only, no pagination, no export.
function setHistory(entry, items) {
  const { historyToggle, history } = entry.refs;
  const list = items || [];
  historyToggle.classList.toggle('avail', list.length > 0);
  history.textContent = '';
  if (!list.length) {
    entry.el.classList.remove('show-history');
    return;
  }
  const now = Date.now();
  for (const h of list) {
    const item = document.createElement('p');
    item.className = 'hist-item';
    const t = document.createElement('span');
    t.className = 't';
    t.textContent = fmtAgoCoarse(now - (h.summarizedAt || now));
    const d = document.createElement('span');
    d.className = 'd';
    d.textContent = h.doing || '';
    item.append(t, d);
    const rest = [h.last, h.next].filter(Boolean).join(' · ');
    if (rest) {
      const r = document.createElement('span');
      r.className = 'rest';
      r.textContent = ' — ' + rest;
      item.append(r);
    }
    history.append(item);
  }
}

// Read-only queue view; draining is the session's own business (tower inbox).
function setMail(entry, mail) {
  const box = entry.refs.mailbox;
  box.textContent = '';
  const messages = mail || [];
  box.classList.toggle('has-mail', messages.length > 0);
  if (!messages.length) return;
  const title = document.createElement('div');
  title.className = 'mail-title';
  title.textContent = `inbox (${messages.length})`;
  box.append(title);
  const now = Date.now();
  for (const m of messages) {
    const row = document.createElement('div');
    row.className = 'mail-row';
    const from = document.createElement('span');
    from.className = 'from';
    from.textContent = m.from;
    const when = document.createElement('span');
    when.className = 'when';
    when.textContent = ' · ' + fmtAgoCoarse(now - m.ts);
    row.append(from, when, document.createTextNode('  ' + m.payload));
    box.append(row);
  }
}

// XSS-safe highlighter: text nodes with <mark> around case-insensitive hits.
// Windows are compared in the original string - toLowerCase can change string
// length (İ -> i + combining dot), which would desync indexOf offsets.
function highlightInto(el, text, q) {
  el.textContent = '';
  const needle = q.toLowerCase();
  const n = q.length;
  let i = 0;
  let from = 0;
  while (i <= text.length - n) {
    if (text.slice(i, i + n).toLowerCase() === needle) {
      el.append(text.slice(from, i));
      const m = document.createElement('mark');
      m.textContent = text.slice(i, i + n);
      el.append(m);
      i += n;
      from = i;
    } else {
      i++;
    }
  }
  el.append(text.slice(from));
}

function updateCard(entry, s, now) {
  const { el, refs } = entry;
  el.dataset.status = s.status;
  refs.statusLabelEl.textContent = statusLabel(s);
  refs.agoNum.textContent = fmtAgo(now - agoBasis(s));
  refs.agoSub.textContent = s.exited ? 'since exit' : s.kind === 'claude' ? 'since activity' : 'since output';
  refs.nameText.textContent = s.name;
  refs.nameText.title = s.name || '';
  refs.badge.hidden = s.kind !== 'claude';
  // queued messages are a quiet chip, never an attention-band event
  refs.mailBadge.hidden = !s.unread;
  if (s.unread) refs.mailBadge.textContent = '✉ ' + s.unread;
  refs.cwd.textContent = shortenCwd(s.cwd);
  refs.cmd.textContent = s.command;
  refs.cmd.title = s.command || '';
  const showBranch = !!(s.kind === 'claude' && s.gitBranch);
  refs.branchSep.hidden = !showBranch;
  refs.branch.hidden = !showBranch;
  if (showBranch) refs.branch.textContent = s.gitBranch;
  // removing the key degrades to v1 on the next refresh even though old
  // summaries are still stored server-side
  const sum = state.summaries && state.summaries.keyless ? null : s.summary;
  el.classList.toggle('has-story', !!sum);
  if (sum) {
    refs.doing.textContent = sum.doing || '';
    // null fields render as nothing at all - no placeholder text
    refs.last.textContent = sum.last || '';
    refs.last.parentElement.hidden = !sum.last;
    refs.next.textContent = sum.next || '';
    refs.next.parentElement.hidden = !sum.next;
    refs.storyAgeText.textContent = 'as of ' + fmtAgoCoarse(now - (sum.summarizedAt || now));
  }
  refs.tail.textContent = el.classList.contains('expanded') ? '' : (s.tail || '');
  const match = s._match;
  const showHits = !!(match && match.matchLines && match.matchLines.length);
  el.classList.toggle('searching', showHits);
  refs.hits.textContent = '';
  if (showHits) {
    for (const line of match.matchLines.slice(0, 3)) {
      const div = document.createElement('div');
      div.className = 'hit';
      highlightInto(div, line.trim(), state.searchQ);
      refs.hits.append(div);
    }
  }
}

function setOutput(entry, lines) {
  const out = entry.refs.output;
  const stick = state.pinned;
  out.textContent = (lines || []).join('\n');
  if (stick) out.scrollTop = out.scrollHeight;
}

async function fetchOutput(id) {
  try {
    const r = await fetch('/api/session/' + id);
    if (r.ok) {
      const data = await r.json();
      state.outputs.set(id, data.lines || []);
      const entry = cards.get(id);
      if (entry && state.expandedId === id) {
        setOutput(entry, data.lines);
        setMail(entry, data.mail);
        setHistory(entry, data.summaryHistory);
      }
    }
  } catch { /* the SSE stream will fill it in */ }
}

function toggleExpand(id) {
  if (state.expandedId === id) {
    state.expandedId = null;
    render();
    return;
  }
  state.expandedId = id;
  state.expandedStamp = 0;
  state.pinned = true;
  render();
  fetchOutput(id);
}

// ---------- board rendering ----------

const board = document.getElementById('board');
let bandAttention = null;
let bandQuiet = null;

function buildBands() {
  board.textContent = '';
  bandAttention = { label: document.createElement('div'), grid: document.createElement('div') };
  bandAttention.label.className = 'band-label attention';
  bandAttention.grid.className = 'grid';
  bandQuiet = { label: document.createElement('div'), grid: document.createElement('div') };
  bandQuiet.label.className = 'band-label';
  bandQuiet.grid.className = 'grid';
  board.append(bandAttention.label, bandAttention.grid, bandQuiet.label, bandQuiet.grid);
}
buildBands();

function bandLabel(el, text, n, attention) {
  el.textContent = '';
  const t = document.createElement('span');
  t.textContent = text;
  const count = document.createElement('span');
  count.className = 'n';
  count.textContent = '(' + n + ')';
  el.append(t, count);
  el.style.display = n ? '' : 'none';
}

// During a search only matching cards render, carrying their match record.
function visibleSessions() {
  if (!state.searchQ || !state.searchResults) return state.sessions;
  const out = [];
  for (const s of state.sessions) {
    const m = state.searchResults.get(s.id);
    if (m) out.push(Object.assign({}, s, { _match: m }));
  }
  return out;
}

function render() {
  const now = Date.now();
  const list = sorted(visibleSessions());

  if (list.length === 0) {
    board.textContent = '';
    const empty = document.createElement('div');
    empty.className = 'empty';
    const p = document.createElement('p');
    if (state.searchQ && state.sessions.length) {
      p.textContent = `no sessions match "${state.searchQ}"`;
      empty.append(p);
    } else {
      p.textContent = 'No sessions yet. Wrap any command and it appears here:';
      const code = document.createElement('code');
      code.textContent = 'tower run npm run dev';
      empty.append(p, code);
    }
    board.append(empty);
    bandAttention = null;
    return;
  }
  if (!bandAttention) buildBands();

  const need = list.filter((s) => ATTENTION.has(s.status));
  const quiet = list.filter((s) => !ATTENTION.has(s.status));
  bandLabel(bandAttention.label, 'needs you', need.length, true);
  bandLabel(bandQuiet.label, need.length ? 'all quiet' : 'all quiet — nothing needs you', quiet.length, false);

  // Snapshot the expanded card's scroll BEFORE any DOM moves: a band change
  // detaches the node (removal loop of one band, re-insert in the other),
  // and a detached node reads scrollTop 0.
  const expandedEntry = state.expandedId ? cards.get(state.expandedId) : null;
  const expandedScroll = expandedEntry ? expandedEntry.refs.output.scrollTop : 0;

  const seen = new Set();
  const place = (bucket, grid) => {
    let cursor = null;
    for (const s of bucket) {
      seen.add(s.id);
      let entry = cards.get(s.id);
      if (!entry) { entry = makeCard(s); cards.set(s.id, entry); }
      updateCard(entry, s, now);
      const expanded = state.expandedId === s.id;
      entry.el.classList.toggle('expanded', expanded);
      if (expanded) entry.refs.tail.textContent = '';
      const next = cursor ? cursor.nextSibling : grid.firstChild;
      if (entry.el !== next) grid.insertBefore(entry.el, next);
      cursor = entry.el;
    }
    while (cursor ? cursor.nextSibling : grid.firstChild) {
      (cursor ? cursor.nextSibling : grid.firstChild).remove();
    }
  };
  place(need, bandAttention.grid);
  place(quiet, bandQuiet.grid);

  if (expandedEntry && expandedEntry.el.isConnected) {
    const out = expandedEntry.refs.output;
    out.scrollTop = state.pinned ? out.scrollHeight : expandedScroll;
  }

  for (const [id, entry] of cards) {
    if (!seen.has(id)) {
      entry.el.remove();
      // the expanded card keeps its entry (and its populated output pane) so
      // clearing a search that filtered it out restores it intact
      if (id !== state.expandedId) cards.delete(id);
    }
  }

  // header counts (active claude sessions count as running)
  const counts = { need: need.length, running: 0, idle: 0, exited: 0 };
  for (const s of state.sessions) {
    if (s.status === 'running' || s.status === 'active') counts.running++;
    else if (s.status === 'idle') counts.idle++;
    else if (s.exited || s.status === 'stale') counts.exited++;
  }
  const countsEl = document.getElementById('counts');
  countsEl.textContent = '';
  const seg = (label, n, cls) => {
    const span = document.createElement('span');
    span.className = cls + (n === 0 ? ' zero' : '');
    const b = document.createElement('b');
    b.textContent = n;
    span.append(b, document.createTextNode(' ' + label));
    return span;
  };
  countsEl.append(
    seg(counts.need === 1 ? 'needs you' : 'need you', counts.need, 'need'),
    seg('running', counts.running, ''),
    seg('idle', counts.idle, ''),
    seg('exited', counts.exited, ''),
  );
  document.title = counts.need ? `(${counts.need}) tower` : 'tower';
}

// ---------- search ----------

const searchInput = document.getElementById('search');
let searchSeq = 0;
let searchDebounce = null;
let lastAutoSearch = 0;

async function doSearch(q) {
  const seq = ++searchSeq;
  try {
    const r = await fetch('/api/search?q=' + encodeURIComponent(q));
    if (!r.ok) return;
    const d = await r.json();
    if (seq !== searchSeq || state.searchQ !== q) return; // a newer query won
    state.searchResults = new Map((d.results || []).map((x) => [x.id, x]));
    render();
  } catch { /* daemon hiccup; keep the current view */ }
}

function runSearch() {
  const q = searchInput.value.trim();
  state.searchQ = q;
  if (!q) {
    state.searchResults = null;
    render();
    return;
  }
  doSearch(q);
}

searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(runSearch, 150);
});

document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  } else if (e.key === 'Escape' && (state.searchQ || document.activeElement === searchInput)) {
    searchInput.value = '';
    state.searchQ = '';
    state.searchResults = null;
    searchInput.blur();
    render();
  }
});

// ---------- notice bar: key trouble, or a one-time dismissible hint ----------

const noticeSlot = document.getElementById('notice-slot');
const HINT_DISMISSED_KEY = 'tower-hint-dismissed';

function renderNotice() {
  const sum = state.summaries || {};
  let mode = null;
  if (sum.error) mode = 'error';
  else if (sum.keyless && !localStorage.getItem(HINT_DISMISSED_KEY)) mode = 'hint';
  const current = noticeSlot.dataset.mode || '';
  if (current === (mode || '')) {
    if (mode === 'error') noticeSlot.querySelector('.text').textContent = 'summaries off: ' + sum.error;
    return;
  }
  noticeSlot.dataset.mode = mode || '';
  noticeSlot.textContent = '';
  if (!mode) return;
  const bar = document.createElement('div');
  bar.className = 'notice' + (mode === 'error' ? ' error' : '');
  const text = document.createElement('span');
  text.className = 'text';
  if (mode === 'error') {
    text.textContent = 'summaries off: ' + sum.error;
    bar.append(text);
  } else {
    text.textContent = 'add an API key to see what each session is doing: ';
    const code = document.createElement('code');
    code.textContent = 'tower config set anthropic_key sk-…';
    const dismiss = document.createElement('button');
    dismiss.className = 'dismiss';
    dismiss.title = 'dismiss';
    dismiss.textContent = '×';
    dismiss.addEventListener('click', () => {
      localStorage.setItem(HINT_DISMISSED_KEY, '1');
      renderNotice();
    });
    bar.append(text, code, dismiss);
  }
  noticeSlot.append(bar);
}

// ---------- live data ----------

function applySessions(sessions, summaries) {
  state.sessions = sessions;
  if (summaries) state.summaries = summaries;
  renderNotice();
  render();
  // fresh output may contain fresh matches; keep an active search current,
  // but at most 1/s - a streaming session drives sessions frames every 100ms,
  // and this must never race the typing debounce (state.searchQ, not the
  // live input value)
  if (state.searchQ && Date.now() - lastAutoSearch > 1000) {
    lastAutoSearch = Date.now();
    doSearch(state.searchQ);
  }
  // an expanded transcript card has no output stream; refetch when it moves
  if (state.expandedId && state.expandedId.startsWith('cc-')) {
    const s = sessions.find((x) => x.id === state.expandedId);
    if (s && s.lastOutputAt !== state.expandedStamp) {
      state.expandedStamp = s.lastOutputAt;
      fetchOutput(s.id);
    }
  }
}

const conn = document.getElementById('conn');
const connLabel = document.getElementById('conn-label');

const es = new EventSource('/api/events');
es.onopen = () => { conn.classList.remove('down'); connLabel.textContent = 'live'; };
es.onerror = () => { conn.classList.add('down'); connLabel.textContent = 'reconnecting'; };
es.onmessage = (e) => {
  let msg = null;
  try { msg = JSON.parse(e.data); } catch { return; }
  if (msg.type === 'sessions') applySessions(msg.sessions || [], msg.summaries);
  else if (msg.type === 'output') {
    state.outputs.set(msg.id, msg.lines || []);
    if (state.expandedId === msg.id) {
      const entry = cards.get(msg.id);
      if (entry) setOutput(entry, msg.lines);
    }
  }
};

fetch('/api/state').then((r) => r.json()).then((d) => applySessions(d.sessions || [], d.summaries)).catch(() => {});

// local ticks keep the ago-clocks honest between server pushes
setInterval(() => { if (state.sessions.length) render(); }, 1000);
function tickClock() {
  const d = new Date();
  document.getElementById('clock').textContent =
    [d.getHours(), d.getMinutes(), d.getSeconds()].map((n) => String(n).padStart(2, '0')).join(':');
}
tickClock();
setInterval(tickClock, 1000);
</script>
